<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#FAFAFA"/>

  <!-- ==================== HEADER ==================== -->
  <text x="720" y="60" text-anchor="middle" font-size="32" font-weight="750" fill="#111827">TODO-App</text>
  <text x="720" y="88" text-anchor="middle" font-size="15" fill="#4B5563">Organisiere deine Aufgaben einfach und effizient</text>

  <!-- Help Button -->
  <rect x="1340" y="38" width="52" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow-sm)"/>
  <text x="1358" y="64" font-size="18" fill="#FF4B4B" font-weight="600">?</text>
  <text x="1378" y="64" font-size="12" fill="#9CA3AF">v</text>

  <!-- ==================== LEFT COLUMN ==================== -->

  <!-- Card: Neue Aufgabe hinzufügen -->
  <rect x="60" y="120" width="480" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/>

  <!-- Section Header -->
  <rect x="90" y="145" width="420" height="42" rx="10" fill="#FEF2F2"/>
  <text x="300" y="172" text-anchor="middle" font-size="16" font-weight="650" fill="#FF4B4B">Neue Aufgabe hinzufugen</text>

  <!-- Row 1: Title + Date -->
  <rect x="110" y="205" width="240" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="125" y="230" font-size="13" fill="#9CA3AF">Was mochtest du erledigen?</text>

  <rect x="365" y="205" width="165" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="380" y="230" font-size="13" fill="#9CA3AF">YYYY/MM/DD</text>

  <!-- Row 2: Category + Manage -->
  <rect x="110" y="260" width="155" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="125" y="285" font-size="13" fill="#111827">Kategorie...</text>
  <text x="247" y="285" font-size="11" fill="#9CA3AF">v</text>

  <rect x="280" y="260" width="250" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="345" y="285" font-size="13" fill="#111827">Kategorien verwalten</text>
  <text x="512" y="285" font-size="11" fill="#9CA3AF">v</text>

  <!-- Erstellen Button -->
  <rect x="110" y="320" width="420" height="42" rx="10" fill="#FF4B4B"/>
  <text x="320" y="347" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Erstellen</text>

  <!-- ==================== Card: Fortschritt ==================== -->
  <rect x="60" y="490" width="480" height="280" rx="16" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/>

  <!-- Section Header -->
  <rect x="90" y="515" width="420" height="42" rx="10" fill="#FEF2F2"/>
  <text x="300" y="542" text-anchor="middle" font-size="16" font-weight="650" fill="#FF4B4B">Fortschritt</text>

  <!-- Metric Cards -->
  <!-- Gesamt -->
  <rect x="110" y="575" width="125" height="72" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow-sm)"/>
  <text x="125" y="597" font-size="12" fill="#4B5563">&#x1F4DD; Gesamt</text>
  <text x="125" y="632" font-size="26" font-weight="700" fill="#111827">7</text>

  <!-- Offen -->
  <rect x="248" y="575" width="125" height="72" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow-sm)"/>
  <text x="263" y="597" font-size="12" fill="#4B5563">&#x231B; Offen</text>
  <text x="263" y="632" font-size="26" font-weight="700" fill="#111827">5</text>

  <!-- Erledigt -->
  <rect x="386" y="575" width="125" height="72" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow-sm)"/>
  <text x="401" y="597" font-size="12" fill="#4B5563">&#x2705; Erledigt</text>
  <text x="401" y="632" font-size="26" font-weight="700" fill="#111827">2</text>

  <!-- Percentage -->
  <text x="300" y="688" text-anchor="middle" font-size="24" font-weight="700" fill="#FF4B4B">28%</text>

  <!-- Progress Bar -->
  <rect x="150" y="700" width="300" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="150" y="700" width="84" height="10" rx="5" fill="url(#progressGrad)"/>
  <defs>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#FCA5A5"/>
    </linearGradient>
  </defs>

  <!-- ==================== RIGHT COLUMN: Meine Aufgaben ==================== -->
  <rect x="580" y="120" width="800" height="650" rx="16" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow)"/>

  <!-- Section Header -->
  <rect x="610" y="145" width="740" height="42" rx="10" fill="#FEF2F2"/>
  <text x="980" y="172" text-anchor="middle" font-size="16" font-weight="650" fill="#FF4B4B">Meine Aufgaben</text>

  <!-- Filter Label -->
  <text x="620" y="218" font-size="12" font-weight="600" fill="#4B5563" letter-spacing="0.5">FILTER</text>

  <!-- Segmented Control -->
  <rect x="620" y="228" width="230" height="36" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="622" y="230" width="75" height="32" rx="7" fill="#FEF2F2"/>
  <text x="659" y="251" text-anchor="middle" font-size="13" font-weight="600" fill="#FF4B4B">Alle</text>
  <text x="735" y="251" text-anchor="middle" font-size="13" fill="#111827">Offen</text>
  <text x="810" y="251" text-anchor="middle" font-size="13" fill="#111827">Erledigt</text>

  <!-- Kategorie Dropdown -->
  <rect x="900" y="228" width="230" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="915" y="251" font-size="13" fill="#111827">Alle Kategorien</text>
  <text x="1112" y="251" font-size="11" fill="#9CA3AF">v</text>

  <!-- Smart Sort Toggle -->
  <rect x="1170" y="234" width="38" height="22" rx="11" fill="#E5E7EB"/>
  <circle cx="1183" cy="245" r="8" fill="#FFFFFF"/>
  <text x="1215" y="249" font-size="14">&#x1F3AF;</text>
  <text x="1238" y="249" font-size="14">&#x2753;</text>

  <!-- ==================== Task Items ==================== -->

  <!-- Task 1: Bachelorarbeit abgeben -->
  <rect x="630" y="280" width="720" height="76" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow-sm)"/>
  <rect x="652" y="306" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="690" y="310" font-size="15" font-weight="500" fill="#111827">Bachelorarbeit abgeben</text>
  <rect x="690" y="320" width="52" height="20" rx="10" fill="#FEF2F2"/>
  <text x="697" y="334" font-size="11" font-weight="600" fill="#FF4B4B">Arbeit</text>
  <text x="755" y="334" font-size="12" fill="#4B5563">&#x1F4C5; 10.05.</text>
  <!-- Edit + Delete buttons -->
  <rect x="1210" y="296" width="52" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1226" y="320" font-size="16">&#x270F;&#xFE0F;</text>
  <rect x="1274" y="296" width="52" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1290" y="320" font-size="14">&#x1F5D1;&#xFE0F;</text>
  <text x="1312" y="320" font-size="10" fill="#9CA3AF">v</text>

  <!-- Task 2: To-Do App prasentieren (overdue) -->
  <rect x="630" y="368" width="720" height="76" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow-sm)"/>
  <rect x="652" y="394" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="690" y="398" font-size="15" font-weight="500" fill="#111827">To-Do App prasentieren</text>
  <rect x="690" y="408" width="52" height="20" rx="10" fill="#FEF2F2"/>
  <text x="697" y="422" font-size="11" font-weight="600" fill="#FF4B4B">Arbeit</text>
  <rect x="755" y="408" width="72" height="20" rx="10" fill="#FEE2E2"/>
  <text x="762" y="422" font-size="11" font-weight="650" fill="#991B1B">&#x26A0;&#xFE0F; 09.01.</text>
  <rect x="1210" y="384" width="52" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1226" y="408" font-size="16">&#x270F;&#xFE0F;</text>
  <rect x="1274" y="384" width="52" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1290" y="408" font-size="14">&#x1F5D1;&#xFE0F;</text>
  <text x="1312" y="408" font-size="10" fill="#9CA3AF">v</text>

  <!-- Task 3: Brot kaufen (done) -->
  <rect x="630" y="456" width="720" height="76" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow-sm)"/>
  <rect x="652" y="482" width="18" height="18" rx="4" fill="#FF4B4B" stroke="#FF4B4B"/>
  <path d="M656,491 l3,3 l6,-6" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="690" y="488" font-size="15" fill="#9CA3AF" text-decoration="line-through">Brot kaufen</text>
  <rect x="690" y="498" width="58" height="20" rx="10" fill="#FEF2F2"/>
  <text x="697" y="512" font-size="11" font-weight="600" fill="#FF4B4B">Einkauf</text>
  <rect x="1210" y="472" width="52" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1226" y="496" font-size="16">&#x270F;&#xFE0F;</text>
  <rect x="1274" y="472" width="52" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1290" y="496" font-size="14">&#x1F5D1;&#xFE0F;</text>
  <text x="1312" y="496" font-size="10" fill="#9CA3AF">v</text>

  <!-- Task 4: test todo (done) -->
  <rect x="630" y="544" width="720" height="76" rx="12" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#shadow-sm)"/>
  <rect x="652" y="570" width="18" height="18" rx="4" fill="#FF4B4B" stroke="#FF4B4B"/>
  <path d="M656,579 l3,3 l6,-6" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="690" y="576" font-size="15" fill="#9CA3AF" text-decoration="line-through">test todo</text>
  <rect x="690" y="586" width="72" height="20" rx="10" fill="#FEF2F2"/>
  <text x="697" y="600" font-size="11" font-weight="600" fill="#FF4B4B">Sonstiges</text>
  <rect x="1210" y="560" width="52" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1226" y="584" font-size="16">&#x270F;&#xFE0F;</text>
  <rect x="1274" y="560" width="52" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="1290" y="584" font-size="14">&#x1F5D1;&#xFE0F;</text>
  <text x="1312" y="584" font-size="10" fill="#9CA3AF">v</text>
</svg>
